[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-pwtr"
version = "0.1.0rc6"
description = "Mixed-pool sampled-prefix weighted trajectory replay for WAM distillation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.7.1", "numpy==1.26.4", "hydra-core==1.3.2", "omegaconf==2.3.0"]
test = ["pytest>=7"]
eval = ["torch==2.7.1", "numpy==1.26.4", "hydra-core==1.3.2", "omegaconf==2.3.0", "Pillow>=10", "PyYAML>=6"]

[project.scripts]
wam-pwtr = "wam_pwtr.cli:main"
wam-pwtr-test = "wam_pwtr.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
